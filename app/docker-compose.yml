version: "3.9"

services:
  # The agent: the Chainlit app, which replaced the Streamlit one. Same
  # service and container name as before, and published on the host's 8501,
  # so the address users have and the security group don't change.
  datalake-agent:
    build: .
    image: datalake-agent:latest
    container_name: datalake-agent
    ports:
      - "8501:8000"
    env_file:
      - .env
    volumes:
      # Knowledge files persist across rebuilds
      - ./knowledge:/app/knowledge
      # Chat history, only when it is on SQLite (CHAT_STORE=sql). DynamoDB,
      # the production store, keeps nothing on the instance.
      - ./data:/app/data
    restart: unless-stopped


  # Local development database for chat history and usage, standing in for
  # the production database (TODO, see ROADMAP.md). Opt-in, so a plain
  # `docker compose up` on a server never starts it:
  #   docker compose --profile local-db up -d chat-db
  # then in .env:
  #   CHAT_DB_URL=postgresql+asyncpg://datalake:datalake_local@localhost:5432/datalake_chat
  chat-db:
    image: postgres:16-alpine
    container_name: datalake-chat-db
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: datalake_chat
      POSTGRES_USER: datalake
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-datalake_local}   # local only
    ports:
      - "127.0.0.1:5432:5432"      # this machine only
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalake -d datalake_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local development DynamoDB, for CHAT_STORE=dynamodb (storage.py). Opt-in
  # like chat-db above:
  #   docker compose --profile local-db up -d chat-dynamodb
  # then in .env:
  #   CHAT_STORE=dynamodb
  #   DYNAMODB_ENDPOINT_URL=http://localhost:8002
  # The app creates its table here on first start. Tests can use it too:
  #   TEST_DYNAMODB_ENDPOINT=http://localhost:8002
  chat-dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: datalake-chat-dynamodb
    profiles: ["local-db"]
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root                     # the image's user can't write a named volume
    ports:
      - "127.0.0.1:8002:8000"      # this machine only; 8000 is Chainlit
    volumes:
      - chat-dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

volumes:
  chat-db-data:
  chat-dynamodb-data:
